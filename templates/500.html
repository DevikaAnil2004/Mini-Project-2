{% extends "base.html" %}

{% block title %}Server Error - CricketIQ{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="fas fa-exclamation-triangle" style="font-size: 60px; color: #dc3545;"></i>
    <h1 class="display-4 my-4">500</h1>
    <h2 class="mb-3">Server Error</h2>
    <p class="lead text-muted mb-4">
        Something went wrong on our end. We&apos;re working to fix it. Please try again later.
    </p>
    <div class="d-flex gap-2 justify-content-center">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> Go to Home
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">

</div>
{% endblock %}
